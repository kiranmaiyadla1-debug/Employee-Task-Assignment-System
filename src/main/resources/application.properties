# ---------------------------------------------------------------
# Employee Task Assignment System - configuration
# Values can be overridden with environment variables, e.g.
#   DB_USERNAME=root DB_PASSWORD=secret mvn spring-boot:run
# ---------------------------------------------------------------
spring.application.name=employee-task-assignment-system
server.port=8080

# ---- MySQL (database is created automatically if it does not exist) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:task_assignment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}

# ---- JPA / Hibernate ----
# "update" creates/updates the employees and tasks tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Error page ----
server.error.include-message=always

# ---- Business rules ----
# Maximum number of ACTIVE (Pending / In Progress) tasks per employee
app.workload.max-active-tasks=5

# Insert demo employees/tasks on first start (only when the employees table is empty).
# Set to false for a clean database.
app.seed-sample-data=true
