<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employees')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('employees')}"></div>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('employees')}"></aside>

    <main class="content">
        <div class="page-head">
            <div>
                <h1>Employees</h1>
                <p class="text-muted mb-0">Add, view, edit and delete employees.</p>
            </div>
            <a th:href="@{/employees/new}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Employee</a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/employees}" method="get" class="card panel mb-3">
            <div class="card-body row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label" for="q">Search</label>
                    <input type="text" id="q" name="q" class="form-control" th:value="${q}"
                           placeholder="Name, email, department or designation">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary flex-fill"><i class="bi bi-search"></i> Search</button>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </div>
        </form>

        <div class="card panel">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th>
                        <th>Active Tasks</th><th>Completed</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(employees)}"><td colspan="8" class="text-center text-muted py-4">No employees found.</td></tr>
                    <tr th:each="e : ${employees}" th:classappend="${e.overloaded} ? 'table-danger overloaded-row'">
                        <td th:text="${e.id}">1</td>
                        <td class="fw-semibold" th:text="${e.name}">Name</td>
                        <td th:text="${e.email}">email</td>
                        <td th:text="${e.department}">Dept</td>
                        <td th:text="${e.designation}">Designation</td>
                        <td>
                            <a th:href="@{/tasks(employeeId=${e.id}, view='active')}" class="text-decoration-none">
                                <span class="badge"
                                      th:classappend="${e.overloaded} ? 'bg-danger' : (${e.atCapacity} ? 'bg-warning text-dark' : 'bg-success')"
                                      th:text="${e.activeTasks} + ' / ' + ${maxActive}">2 / 5</span>
                            </a>
                            <span th:if="${e.overloaded}" class="badge bg-danger ms-1"><i class="bi bi-exclamation-triangle-fill"></i> Overloaded</span>
                        </td>
                        <td th:text="${e.completedTasks}">0</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/employees/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i> Edit</a>
                            <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post" class="d-inline"
                                  th:attr="data-confirm='Delete ' + ${e.name} + '? Their tasks will be kept but become unassigned.'">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
