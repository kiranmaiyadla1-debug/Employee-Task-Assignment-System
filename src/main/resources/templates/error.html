<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('')}"></div>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('')}"></aside>
    <main class="content">
        <div class="card panel form-card">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-circle display-3 text-danger"></i>
                <h1 class="mt-3"><span th:text="${status}">500</span> - <span th:text="${error}">Error</span></h1>
                <p class="text-muted" th:text="${message}">Something went wrong.</p>
                <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to Dashboard</a>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
