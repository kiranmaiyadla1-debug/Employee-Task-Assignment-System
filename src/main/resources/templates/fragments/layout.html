<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared page pieces. Pages include them with, for example:
    <head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | TaskFlow'">TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Navigation links (used by the sidebar and by the mobile menu) -->
<nav th:fragment="navlinks(active)" class="nav flex-column nav-pills gap-1">
    <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}">
        <i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" th:classappend="${active == 'employees'} ? 'active'" th:href="@{/employees}">
        <i class="bi bi-people"></i> Employees</a>
    <a class="nav-link" th:classappend="${active == 'tasks'} ? 'active'" th:href="@{/tasks}">
        <i class="bi bi-list-check"></i> Tasks</a>
    <a class="nav-link" th:classappend="${active == 'assignments'} ? 'active'" th:href="@{/assignments}">
        <i class="bi bi-person-check"></i> Task Assignment</a>
    <a class="nav-link" th:classappend="${active == 'workload'} ? 'active'" th:href="@{/workload}">
        <i class="bi bi-bar-chart-line"></i> Workload Monitor</a>
</nav>

<!-- Desktop sidebar -->
<aside th:fragment="sidebar(active)" class="sidebar d-none d-lg-flex flex-column">
    <a th:href="@{/}" class="brand"><i class="bi bi-kanban-fill"></i> TaskFlow</a>
    <div th:replace="~{fragments/layout :: navlinks(${active})}"></div>
    <div class="sidebar-foot mt-auto small">
        <i class="bi bi-shield-check"></i> Max <span th:text="${@environment.getProperty('app.workload.max-active-tasks', '5')}">5</span> active tasks per employee
    </div>
</aside>

<!-- Mobile top bar + slide-in menu -->
<div th:fragment="topbar(active)">
    <header class="topbar d-lg-none d-flex align-items-center justify-content-between px-3">
        <a th:href="@{/}" class="brand mb-0"><i class="bi bi-kanban-fill"></i> TaskFlow</a>
        <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu" aria-controls="mobileMenu">
            <i class="bi bi-list fs-5"></i>
        </button>
    </header>
    <div class="offcanvas offcanvas-start sidebar-offcanvas" tabindex="-1" id="mobileMenu">
        <div class="offcanvas-header">
            <span class="brand mb-0"><i class="bi bi-kanban-fill"></i> TaskFlow</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div th:replace="~{fragments/layout :: navlinks(${active})}"></div>
        </div>
    </div>
</div>

<!-- Success / error messages (flash attributes or model attributes) -->
<th:block th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show auto-hide" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Something went wrong</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
